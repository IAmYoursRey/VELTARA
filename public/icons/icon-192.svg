<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E0A3C"/>
      <stop offset="50%" stop-color="#2E1065"/>
      <stop offset="100%" stop-color="#0F051D"/>
    </linearGradient>
    <linearGradient id="leftWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="60%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
    <linearGradient id="rightWing" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="40%" stop-color="#9333EA"/>
      <stop offset="100%" stop-color="#581C87"/>
    </linearGradient>
    <linearGradient id="innerFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E9D5FF"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="cyanFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)" stroke="#4C1D95" stroke-width="2"/>

  <!-- Subtle glow aura -->
  <circle cx="96" cy="96" r="48" fill="#8B5CF6" opacity="0.3" filter="url(#glow)"/>

  <!-- Modern Faceted 3D "V" Emblem -->
  <!-- Left Outer Facet -->
  <polygon points="46,52 74,52 90,118 70,118" fill="url(#leftWing)" />
  <!-- Left Inner Facet -->
  <polygon points="74,52 88,52 96,140 88,140" fill="url(#cyanFacet)" opacity="0.9" />

  <!-- Right Inner Facet -->
  <polygon points="104,52 118,52 104,140 96,140" fill="url(#innerFacet)" />
  <!-- Right Outer Facet -->
  <polygon points="118,52 146,52 122,118 102,118" fill="url(#rightWing)" />

  <!-- Center Vertex Cap & Highlight -->
  <polygon points="88,140 96,150 104,140 96,132" fill="#FFFFFF" />

  <!-- Authenticity Diamond Indicator -->
  <circle cx="148" cy="48" r="7" fill="#38BDF8" stroke="#1E0A3C" stroke-width="2"/>
</svg>
